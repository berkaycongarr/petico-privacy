<style>
  :root {
    --dark: #143D28;
    --mid: #217A4B;
    --sage: #97BC62;
    --cream: #F4F7F1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: var(--dark);
    color: var(--cream);
    font-family: 'Quicksand', 'Segoe UI', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card { max-width: 420px; width: 100%; text-align: center; }
  .paw { width: 132px; height: 132px; margin: 0 auto 20px; }
  h1 { font-size: 2.1rem; letter-spacing: 0.5px; margin-bottom: 8px; }
  .tagline { color: var(--sage); font-size: 1.05rem; margin-bottom: 36px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 17px 20px;
    margin-bottom: 14px;
    border-radius: 999px;
    background: var(--cream);
    color: var(--dark);
    text-decoration: none;
    font-weight: 700;
    font-size: 1.05rem;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .btn:hover { transform: translateY(-2px); background: #ffffff; }
  .btn.android { background: var(--sage); color: var(--dark); }
  .btn.android:hover { background: #a6c973; }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .foot { margin-top: 34px; font-size: 0.85rem; color: rgba(244,247,241,0.55); }
  .foot a { color: var(--sage); text-decoration: none; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
